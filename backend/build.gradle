plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.practiceproject'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // Stores HTTP sessions in Postgres, so a login survives restarts and works across several app instances.
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // implementation (not runtimeOnly): SeatEvents uses the driver's LISTEN/NOTIFY API directly.
    implementation 'org.postgresql:postgresql'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.google.zxing:javase:3.5.4'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    // Keeps parameter names in bytecode so @PathVariable/@RequestParam work without repeating names.
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
    // Integration tests share one Postgres test database, so run test classes one at a time.
    maxParallelForks = 1
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
