# Every value can be overridden by an environment variable, e.g. DATABASE_URL.
# Defaults are for local development only. See docs/RUNNING.md and docs/DEPLOYMENT.md.
server:
  port: ${PORT:8090}
  # Trust X-Forwarded-* headers. Only safe behind a reverse proxy you control (see DEPLOYMENT.md).
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 14d
      cookie:
        name: PPSESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

spring:
  # Optional local overrides in backend/.env (KEY=value lines; see .env.example). Git-ignored.
  config:
    import: optional:file:.env[.properties]
  application:
    name: practice-project
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/practice}
    username: ${DATABASE_USERNAME:practice}
    password: ${DATABASE_PASSWORD:practice}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:15}
  jpa:
    # Schema is owned by Flyway migrations, never by Hibernate.
    hibernate:
      ddl-auto: none
    # Off: database work happens inside services, not lazily while JSON is written.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */10 * * * *"
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1026}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: 1800000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # Where the React app lives: used in emails and for post-payment redirects.
  frontend-url: ${FRONTEND_URL:http://localhost:5180}
  # Public URL of THIS backend: used for gateway callbacks and absolute media URLs.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8090}
  # Browser origins allowed to call the API with cookies (comma separated).
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5180}
  # Signs short-lived tokens (dev payment simulator form). Must be long and random in production.
  signing-secret: ${APP_SIGNING_SECRET:dev-only-signing-secret-change-me-0123456789}
  currency: NPR
  currency-symbol: "Rs."
  mail-from: ${MAIL_FROM:Practice Project <tickets@practice-project.local>}
  jobs:
    enabled: ${JOBS_ENABLED:true}
  seed:
    # Inserts clearly-labelled sample data when the database is empty and keeps
    # sample showtimes rolling a week ahead. Never enable in production.
    enabled: ${SEED_SAMPLE_DATA:true}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@12345}
  payments:
    # Development-only payment simulator. No money moves. Refused under the prod profile.
    dev-sandbox-enabled: ${PAYMENT_DEV_SANDBOX_ENABLED:true}
    esewa:
      enabled: ${ESEWA_ENABLED:true}
      # Defaults are eSewa's PUBLIC test (UAT) merchant, published in their developer docs.
      product-code: ${ESEWA_PRODUCT_CODE:EPAYTEST}
      secret-key: ${ESEWA_SECRET_KEY:8gBm/:&EnhH.1/q}
      form-url: ${ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
      status-url: ${ESEWA_STATUS_URL:https://rc.esewa.com.np/api/epay/transaction/status/}
      live: ${ESEWA_LIVE:false}
    khalti:
      # Empty = Khalti disabled. Get a sandbox key from https://test-admin.khalti.com
      secret-key: ${KHALTI_SECRET_KEY:}
      base-url: ${KHALTI_BASE_URL:https://dev.khalti.com/api/v2}
      live: ${KHALTI_LIVE:false}
  tmdb:
    # Empty = TMDB import disabled. https://www.themoviedb.org/settings/api
    api-key: ${TMDB_API_KEY:}
